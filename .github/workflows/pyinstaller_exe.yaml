name: Build PyInstaller Package
 
on:
  push:
    branches:
      - main  # 你可以根据需要修改分支名
 
jobs:
  build:
    runs-on: ubuntu-latest  # 你可以选择其他操作系统，如 windows-latest 或 macos-latest
 
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
 
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.13'  # 使用你需要的 Python 版本
 
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller uv
        # 安装你的项目依赖
        uv sync  # 确保你有一个 requirements.txt 文件
    - name: Build PyInstaller package
      run: |
        pyinstaller --onefile --name=py_server main.py  # 替换为你的主脚本文件名或使用 --onefile 或其他 PyInstaller 选项
        # 例如，如果你想要一个单文件输出，使用：pyinstaller --onefile your_script.py
    - name: Upload artifact
      uses: actions/upload-artifact@v2
      with:
        name: dist  # 上传的 artifact 名称，你可以自定义这个名称
        path: dist/  # PyInstaller 的默认输出目录，确保这是正确的路径或根据需要调整路径
